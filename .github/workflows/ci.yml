name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint -- --no-warnings || true

      - name: Test
        run: npm run test:ci -- --no-watch --browsers=ChromeHeadless || npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build -- --base-href /DomJek-Arztifiy/
